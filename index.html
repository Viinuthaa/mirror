<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mirror</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Mirror</h1>
        <p>Frontend UI stress-testing tool</p>
    </header>

    <main>
        <section class="editor">
            <h2>Your HTML</h2>

            <textarea id="htmlInput" placeholder="Paste your HTML here..."></textarea>

            <button id="previewBtn">Preview</button>
        </section>

        <section class="preview">
            <div class="preview-header">
                <h2>Preview</h2>

                <div class="view-controls">
                    <button class="view-btn active" data-width="375">Mobile</button>
                    <button class="view-btn" data-width="768">Tablet</button>
                    <button class="view-btn" data-width="100%">Desktop</button>
                </div>
            </div>

            <div class="preview-frame">
                <div id="previewArea"></div>
            </div>
        </section>

        <section class="checks">
            <h2>UI Checks</h2>

            <p id="checkStatus">No scan run yet.</p>

            <div id="issues"></div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
